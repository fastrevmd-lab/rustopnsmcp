[workspace]
members = [
    "rustopnsmcp",
    "rustopnsmcp-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustopnsmcp"
authors = ["fastrevmd-lab"]

[workspace.dependencies]
rustopnsmcp-core = { path = "rustopnsmcp-core", version = "0.1.0" }

anyhow      = "1"
base64      = "0.23"
clap        = { version = "4", features = ["derive"] }
rmcp        = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustls      = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
schemars    = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util  = { version = "0.7", default-features = false, features = ["rt"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url         = "2"
uuid        = { version = "1", features = ["v4"] }
zeroize     = "1"

# Test-only
rcgen        = "0.14"
tempfile     = "3"
tokio-rustls = "0.26"

# mecmcp is consumed at an exact pinned version. Do not relax the tag.
# mecmcp-changeset is the governed-write lifecycle (plan -> digest -> human
# approve -> apply with drift check); every other crate here is read-only
# support (transport, auth, audit, secrets, inventory).
mecmcp-audit     = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-auth      = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-changeset = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-http      = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-inventory = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-runtime   = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-secret    = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-server    = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
mecmcp-transport = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.24.1" }
# TEMPORARY: mecmcp-redact was added to mecmcp's main branch (#386) after
# v0.24.1 was tagged and has not shipped in a released tag yet. Pinned to a
# rev, not a tag, until a release carries it — replace `rev` with the tag
# once one does, matching every other entry above.
mecmcp-redact    = { version = "0.24.1", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "9112ce84bfefbab66d0ead3be6bbffe33f04c4f2" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
